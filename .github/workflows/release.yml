name: Release

# Fires when bin/cut-release pushes a version tag: builds the DMG on a macOS
# runner (signed + notarized when the signing secrets exist, unsigned otherwise
# — see the Check signing secrets step) and publishes a GitHub Release with
# checksums + notes from the CHANGELOG section (commit-list fallback via
# scripts/release/notes.ts).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history for the notes fallback
          # NO submodules. The comment that used to sit here claimed the
          # project-template sha needed them; that was false (ticket 103).
          # ADR-0005 embedded the template as ordinary tracked files and dropped
          # the submodule, and `.gitmodules` now has exactly one entry — the
          # third-party vendor/agentview, which is never imported, built or
          # packaged (ADR-0017). __TEMPLATE_SHA__ comes from
          # `git log -1 -- templates/project-template`, which reads tracked
          # files. Verified: that command returns the same sha in a checkout
          # where the submodule is uninitialised.
          #
          # So the flag fetched nothing the release build used, and only pulled
          # an untrusted third-party checkout onto the release runner.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # pinned for reproducible CI (matches local toolchain)

      - name: Verify tag matches package.json
        run: |
          PKG="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      # Full install: packaging needs the electron-rebuild postinstall for the
      # native modules (node-pty, better-sqlite3).
      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # Signing + notarization (ticket 93). Gated on the secrets EXISTING, so a
      # fork — or this repo before the secrets are set — still produces a
      # working unsigned build instead of a red X on every tag.
      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets — building UNSIGNED. macOS will not deliver notifications from this build (Electron 42+)."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain, not the runner's login one: it is deleted with
          # the runner, and keeping it separate means the cert is never visible
          # to any other step's default keychain search list.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSPHRASE="$(uuidgen)"
          security create-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that never comes and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSPHRASE" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build DMG
        env:
          # The cert is already in the throwaway keychain, so electron-builder
          # just needs permission to go find it. No CSC_LINK: that is for
          # passing a .p12 inline, which we deliberately do not do twice.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.available }}
          TERMINAL_UNSIGNED: ${{ steps.signing.outputs.available == 'true' && '0' || '1' }}
        run: bun run dist

      - name: Notarize + staple
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          DMG="$(ls -t dist/*.dmg | head -n1)"
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          rm -f "$KEY"
          # The real assertion: --verify passes on an un-notarized build too.
          # Only Gatekeeper assessment proves a downloader will be let through.
          APP="$(ls -d dist/mac*/TerMinal.app | head -n1)"
          xcrun stapler staple "$APP" || true
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes
        run: bun scripts/release/notes.ts "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TerMinal ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
