name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # pinned for reproducible CI (matches local toolchain)

      # --ignore-scripts skips node-pty's electron-rebuild (native build not
      # needed for typecheck/test/bundle, and avoids CI flakiness).
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format
        run: bun run format:check

      # Pre-existing violations are baselined in eslint-suppressions.json, so
      # this fails only on NEW ones. Regenerate with `bun run lint:baseline`
      # after a deliberate cleanup — never to silence a fresh violation.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # High/Critical advisories in the dependency tree are blocking (CLAUDE.md §10).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit
        run: bun audit --audit-level=high

  # Packaging is the layer format/typecheck/test/build cannot reach: the native
  # rebuild against Electron's ABI, the electron-builder config, and the ESM main
  # bundle actually booting. Until now it was first exercised at tag time by
  # release.yml, so a PR could break packaging and nobody found out until a
  # release. See scripts/ci/smoke-packaged-app.sh.
  package-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # project-template sha is baked into the build stamp

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Full install, deliberately WITHOUT --ignore-scripts: the postinstall
      # electron-rebuild is exactly what this job exists to exercise.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run dist

      # Blocking: verified on the hosted runner (the app opens 1 window and
      # stays up in ~9s). If this ever goes flaky, fix the script rather than
      # demoting the assertion — an unenforced smoke test is worse than none.
      - name: Launch the packaged app
        run: scripts/ci/smoke-packaged-app.sh

  # Flags vulnerable or newly-risky dependencies introduced by a PR's diff.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
