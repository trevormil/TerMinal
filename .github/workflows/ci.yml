name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # pinned for reproducible CI (matches local toolchain)

      # --ignore-scripts skips node-pty's electron-rebuild (native build not
      # needed for typecheck/test/bundle, and avoids CI flakiness).
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format
        run: bun run format:check

      # Pre-existing violations are baselined in eslint-suppressions.json, so
      # this fails only on NEW ones. If it fails with "suppressions left that do
      # not occur anymore" you FIXED a baselined violation — run
      # `bun run lint:prune`, which drops only the now-stale entries.
      # Do NOT reach for `lint:baseline`: it regenerates from scratch and would
      # re-suppress any genuinely new violation on your own branch.
      - name: Lint
        run: bun run lint

      - name: No leaked machine paths
        run: scripts/ci/no-machine-paths.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # A test must never reach the operator's activity feed, chat or phone.
      # Re-runs the suite under an independent observer and fails if it made a
      # single outbound request or appended a single activity event — something
      # the guard's own unit tests cannot see across a whole run.
      - name: Effect canary
        run: bun run test:effects

      - name: Build
        run: bun run build

  # High/Critical advisories in the dependency tree are blocking (CLAUDE.md §10).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit
        run: bun audit --audit-level=high

  # Packaging is the layer format/typecheck/test/build cannot reach: the native
  # rebuild against Electron's ABI, the electron-builder config, and the ESM main
  # bundle actually booting. Until now it was first exercised at tag time by
  # release.yml, so a PR could break packaging and nobody found out until a
  # release. See scripts/ci/smoke-packaged-app.sh.
  package-smoke:
    runs-on: macos-15
    # macOS minutes bill at 10x, and `bun run dist` pulls Electron + dmgbuild
    # over the network — a network hang would otherwise run to GitHub's 360m
    # default. The job takes ~6m; 25 is generous headroom, not a target.
    timeout-minutes: 25
    steps:
      # No `submodules: true`: the only submodule is the third-party
      # vendor/agentview (ADR-0017), which nothing in the build touches. The
      # template ships as ordinary tracked files under templates/ (ADR-0005),
      # and __TEMPLATE_SHA__ comes from `git log` over those files.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Full install, deliberately WITHOUT --ignore-scripts: the postinstall
      # electron-rebuild is exactly what this job exists to exercise.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run dist

      # Blocking: verified on the hosted runner (the app opens 1 window and
      # stays up in ~9s). If this ever goes flaky, fix the script rather than
      # demoting the assertion — an unenforced smoke test is worse than none.
      - name: Launch the packaged app
        run: scripts/ci/smoke-packaged-app.sh

      # Tier 1 of the UX suite (docs/ux-testing.md). It rides in THIS job on
      # purpose: macOS minutes bill at 10x, and `bun run dist` has already paid
      # for the checkout, the full install with the native rebuild, and the
      # `out/` bundle the suite launches. A second macOS job would double that
      # cost to re-derive the same artifacts.
      #
      # NOT blocking yet — deliberately, and with an end date. Every assertion
      # in it is deterministic and it has been green locally, but it has never
      # run on a hosted runner, and a blocking gate that turns out to be flaky
      # on a 10x-billed runner is a tax on every future PR (and gets disabled
      # within a week, at which point it is worse than nothing). Flip
      # `continue-on-error` to false once it has ~a week of clean runs on main
      # — tracked by the follow-up ticket referenced in docs/ux-testing.md.
      # The step still runs on every PR and its failures are visible in the log.
      - name: UX suite (tier 1)
        continue-on-error: true
        run: bun run test:ux

      - name: Upload UX suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-suite-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Flags vulnerable or newly-risky dependencies introduced by a PR's diff.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
