name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pages must be enabled by a human: Settings → Pages → Source: GitHub
      # Actions. This workflow cannot do it for us — configure-pages' own
      # `enablement: true` option "requires a token other than GITHUB_TOKEN",
      # and `administration` is not a scope a workflow `permissions:` block can
      # grant. Until the toggle is flipped, every run fails with "Get Pages site
      # failed … verify that the repository has Pages enabled".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
