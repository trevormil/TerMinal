appId: com.terminal.app
productName: TerMinal
# electron-vite outputs the bundled main/preload/renderer to out/; package that.
directories:
  buildResources: build # build/icon.icns is picked up automatically
files:
  - out/**
  - package.json
# The headless cron runner + script helpers ship as real files
# (Contents/Resources/{terminal-cron,terminal-cli}); the app copies them to
# ~/.config/TerMinal/bin on launch so launchd + scripts have stable paths.
extraResources:
  - from: bin/terminal-cron
    to: terminal-cron
  - from: bin/terminal-cli
    to: terminal-cli
  - from: bin/terminal-mcp-server
    to: terminal-mcp-server
  # Monitoring daemon — copied to ~/.config/TerMinal/bin, run by its own launchd job.
  - from: bin/terminal-monitor
    to: terminal-monitor
  # OpenRouter (or-agent) tier — installed to ~/.config/TerMinal/{bin,model-routing}
  - from: bin/or-exec
    to: or-exec
  - from: bin/or-agent
    to: or-agent
  - from: bin/or-spend
    to: or-spend
  - from: bin/model-routing
    to: model-routing
  # The embedded project template — packaged so scaffolding works offline
  # without cloning (resolution: src/main/template.ts candidates).
  - from: templates/project-template
    to: templates/project-template
  # The global tm plugin — installed to ~/.config/TerMinal/plugin on launch and
  # linked as ~/.claude/skills/tm (plugin-install.ts).
  - from: plugin
    to: plugin
# node-pty and better-sqlite3 ship native .node binaries that can't live inside
# the asar archive — unpack them so they load at runtime.
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/bindings/**'
mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Signing (ticket 93). `identity` is intentionally UNSET so electron-builder
  # resolves it from CSC_NAME / the keychain — that way one config covers both
  # the signed path and an unsigned fallback, instead of two divergent configs.
  #
  # Set TERMINAL_UNSIGNED=1 to force the old ad-hoc behaviour (a contributor
  # without the cert can still build). bin/release passes it automatically when
  # no Developer ID identity is present.
  #
  # Notarization is REQUIRED, not cosmetic: since Electron 42 macOS only
  # delivers notifications for a signed app, so an unsigned build silently loses
  # the desktop alert channel.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false # bin/release + release.yml notarize explicitly (notarytool)
